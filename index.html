<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#244d41">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>Waypoint · Your next chapter</title>
  <style>
    html,body{margin:0;min-height:100%;background:#244d41}
    body.app-ready{background:#f7f8f5}
    .startup-splash{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;color:#f3f7ea;background:radial-gradient(circle at 50% 44%,#376655 0,#294f43 35%,#244d41 70%);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .startup-splash::before,.startup-splash::after{content:"";position:absolute;width:34rem;height:34rem;border:1px solid rgba(220,233,200,.09);border-radius:50%}
    .startup-splash::before{transform:translate(-18rem,-17rem)}
    .startup-splash::after{transform:translate(20rem,18rem)}
    .startup-splash__content{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center}
    .startup-splash__mark{width:66px;height:66px;display:grid;place-items:center;margin-bottom:22px;border:1px solid rgba(229,237,218,.22);border-radius:20px;background:rgba(229,237,218,.1);box-shadow:0 18px 55px rgba(11,35,27,.24)}
    .startup-splash__mark svg{width:38px;height:38px}
    .startup-splash__brand{margin:0;font-size:34px;font-weight:650;letter-spacing:-1.7px}
    .startup-splash__brand span{color:#b9cc91}
    .startup-splash__message{margin:11px 0 25px;color:#c8d5ca;font-size:12px;letter-spacing:.35px}
    .startup-splash__progress{position:relative;width:112px;height:2px;overflow:hidden;border-radius:2px;background:rgba(232,239,222,.16)}
    .startup-splash__progress::after{content:"";position:absolute;inset:0;width:45%;border-radius:2px;background:#c6d99e;animation:startup-progress 1.2s ease-in-out infinite}
    @keyframes startup-progress{from{transform:translateX(-115%)}to{transform:translateX(255%)}}
    @media(prefers-reduced-motion:reduce){.startup-splash__progress::after{animation:none;left:28%}}
  </style>
</head>
<body>
  <div id="app">
    <div class="startup-splash" role="status" aria-live="polite" aria-label="Waypoint is starting">
      <div class="startup-splash__content">
        <div class="startup-splash__mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M9 36c6-1 7-10 13-12s8 5 15-12" stroke="#e5edda" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3.5 4.5"/>
            <circle cx="9" cy="36" r="3.5" fill="#b9cc91"/>
            <circle cx="22" cy="24" r="3.5" fill="#e5edda"/>
            <circle cx="37" cy="12" r="4" fill="#b9cc91"/>
          </svg>
        </div>
        <p class="startup-splash__brand">waypoint<span>.</span></p>
        <p class="startup-splash__message">Preparing your next chapter</p>
        <span class="startup-splash__progress" aria-hidden="true"></span>
      </div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/wails-entry.ts"></script>
</body>
</html>
