name: Publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-universal
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
      - run: npm ci
      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify application
        if: runner.os == 'Linux'
        run: npm test && npm run build && go test ./...
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Build macOS universal DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wails build -clean -platform darwin/universal
          mkdir -p artifacts "$RUNNER_TEMP/waypoint-dmg"
          cp -R build/bin/Waypoint.app "$RUNNER_TEMP/waypoint-dmg/"
          ln -s /Applications "$RUNNER_TEMP/waypoint-dmg/Applications"
          hdiutil create -volname Waypoint -srcfolder "$RUNNER_TEMP/waypoint-dmg" -ov -format UDZO artifacts/Waypoint-macos-universal.dmg
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          wails build -clean -platform windows/amd64 -nsis -webview2 download
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem build/bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails did not produce an NSIS installer." }
          Copy-Item $installer.FullName artifacts/Waypoint-windows-x64-Setup.exe
      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41
          package="$RUNNER_TEMP/waypoint-deb"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/share/applications" "$package/usr/share/icons/hicolor/256x256/apps" artifacts
          install -m 0755 build/bin/Waypoint "$package/usr/bin/waypoint"
          install -m 0644 build/appicon.png "$package/usr/share/icons/hicolor/256x256/apps/waypoint.png"
          cat > "$package/DEBIAN/control" <<'EOF'
          Package: waypoint
          Version: 0.1.0
          Section: office
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Maintainer: Chamuka Inc.
          Description: Private evidence-led career research workspace
          EOF
          cat > "$package/usr/share/applications/waypoint.desktop" <<'EOF'
          [Desktop Entry]
          Name=Waypoint
          Comment=Private evidence-led career research workspace
          Exec=/usr/bin/waypoint
          Icon=waypoint
          Terminal=false
          Type=Application
          Categories=Office;
          EOF
          dpkg-deb --build "$package" artifacts/Waypoint-linux-x64.deb
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          log="$RUNNER_TEMP/waypoint-wails.log"
          xvfb-run -a build/bin/Waypoint >"$log" 2>&1 &
          app_pid=$!
          ready=0
          for _ in {1..30}; do
            if grep -q "WAYPOINT_WAILS_READY" "$log"; then ready=1; break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$log"
          kill "$app_pid" 2>/dev/null || true
          pkill -P "$app_pid" 2>/dev/null || true
          test "$ready" -eq 1
      - uses: actions/upload-artifact@v6
        with:
          name: Waypoint-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "Waypoint ${GITHUB_REF_NAME#v}"
          fi
