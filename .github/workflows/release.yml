name: Publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-universal
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: true
      - run: npm ci
      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/waypoint-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MACOS_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Verify application
        if: runner.os == 'Linux'
        run: npm test && npm run build && go test ./...
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Build macOS universal DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          wails build -clean -platform darwin/universal
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/bin/Waypoint.app
          codesign --verify --deep --strict --verbose=2 build/bin/Waypoint.app
          mkdir -p artifacts "$RUNNER_TEMP/waypoint-dmg"
          cp -R build/bin/Waypoint.app "$RUNNER_TEMP/waypoint-dmg/"
          ln -s /Applications "$RUNNER_TEMP/waypoint-dmg/Applications"
          hdiutil create -volname Waypoint -srcfolder "$RUNNER_TEMP/waypoint-dmg" -ov -format UDZO artifacts/Waypoint-macos-universal.dmg
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" artifacts/Waypoint-macos-universal.dmg
          xcrun notarytool submit artifacts/Waypoint-macos-universal.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple artifacts/Waypoint-macos-universal.dmg
          xcrun stapler validate artifacts/Waypoint-macos-universal.dmg
          spctl --assess --type open --context context:primary-signature --verbose=2 artifacts/Waypoint-macos-universal.dmg
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ] && [ -f "$MACOS_KEYCHAIN_PATH" ]; then
            security delete-keychain "$MACOS_KEYCHAIN_PATH"
          fi
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:PATH = "C:\Program Files (x86)\NSIS;$env:PATH"
          wails build -clean -platform windows/amd64 -nsis -webview2 download
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $installer = Get-ChildItem build/bin -Filter "*installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "Wails did not produce an NSIS installer." }
          Copy-Item $installer.FullName artifacts/Waypoint-windows-x64-Setup.exe
      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41
          package="$RUNNER_TEMP/waypoint-deb"
          mkdir -p "$package/DEBIAN" "$package/usr/bin" "$package/usr/share/applications" "$package/usr/share/icons/hicolor/256x256/apps" artifacts
          install -m 0755 build/bin/Waypoint "$package/usr/bin/waypoint"
          install -m 0644 build/appicon.png "$package/usr/share/icons/hicolor/256x256/apps/waypoint.png"
          cat > "$package/DEBIAN/control" <<'EOF'
          Package: waypoint
          Version: 0.2.0
          Section: office
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Maintainer: Chamuka Inc.
          Description: Private evidence-led career research workspace
          EOF
          cat > "$package/usr/share/applications/waypoint.desktop" <<'EOF'
          [Desktop Entry]
          Name=Waypoint
          Comment=Private evidence-led career research workspace
          Exec=/usr/bin/waypoint
          Icon=waypoint
          Terminal=false
          Type=Application
          Categories=Office;
          EOF
          dpkg-deb --build "$package" artifacts/Waypoint-linux-x64.deb
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          log="$RUNNER_TEMP/waypoint-wails.log"
          xvfb-run -a build/bin/Waypoint >"$log" 2>&1 &
          app_pid=$!
          ready=0
          for _ in {1..30}; do
            if grep -q "WAYPOINT_WAILS_READY" "$log"; then ready=1; break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$log"
          kill "$app_pid" 2>/dev/null || true
          pkill -P "$app_pid" 2>/dev/null || true
          test "$ready" -eq 1
      - uses: actions/upload-artifact@v6
        with:
          name: Waypoint-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "Waypoint ${GITHUB_REF_NAME#v}"
          fi
