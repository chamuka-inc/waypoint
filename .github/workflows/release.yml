name: Publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-arm64
          - os: windows-2025
            artifact: windows-x64
          - os: ubuntu-24.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify application
        if: runner.os == 'Linux'
        run: npm test && npm run build
      - name: Build Electrobun release
        run: npm run package
      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2
          log="$RUNNER_TEMP/waypoint-desktop.log"
          xvfb-run -a build-electrobun/stable-linux-x64/Waypoint/bin/launcher >"$log" 2>&1 &
          app_pid=$!
          ready=0
          for _ in {1..20}; do
            if grep -q "WAYPOINT_DESKTOP_READY" "$log"; then ready=1; break; fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat "$log"
          kill "$app_pid" 2>/dev/null || true
          pkill -P "$app_pid" 2>/dev/null || true
          test "$ready" -eq 1
      - uses: actions/upload-artifact@v6
        with:
          name: Waypoint-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "Waypoint ${GITHUB_REF_NAME#v}"
          fi
